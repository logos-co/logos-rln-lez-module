name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo:
    name: cargo (clippy, test)
    environment: ${{ github.ref == 'refs/heads/main' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Nix and Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      - name: Generate the rust build inputs
        run: nix run .#generate -L

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: rust-lib

      - name: cargo clippy
        working-directory: rust-lib
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: rust-lib
        run: cargo test --locked
